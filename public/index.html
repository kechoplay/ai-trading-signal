<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Trading Signal — XAU/USD</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --border: #e8eaed;
      --text: #1a1d23;
      --muted: #6b7280;
      --sell-accent: #ef4444;
      --buy-accent: #22c55e;
      --neutral-accent: #f59e0b;
      --tag-down-bg: #fee2e2;
      --tag-down-text: #b91c1c;
      --tag-up-bg: #dcfce7;
      --tag-up-text: #15803d;
      --tag-neutral-bg: #fef3c7;
      --tag-neutral-text: #b45309;
      --resistance-color: #ef4444;
      --support-color: #22c55e;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    .page-header {
      max-width: 960px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.3px;
    }

    .page-title span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }

    .refresh-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
      transition: background .15s;
    }
    .refresh-btn:hover { background: #f3f4f6; }

    .analyze-btn {
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      color: #fff;
      border-color: transparent;
      font-weight: 600;
    }
    .analyze-btn:hover { background: linear-gradient(90deg, #4f46e5, #7c3aed); }
    .analyze-btn:disabled { opacity: .6; cursor: not-allowed; }

    .btc-btn {
      background: linear-gradient(90deg, #f7931a, #f59e0b);
      color: #fff;
      border-color: transparent;
      font-weight: 600;
    }
    .btc-btn:hover { background: linear-gradient(90deg, #e0820f, #d97706); }
    .btc-btn:disabled { opacity: .6; cursor: not-allowed; }


    /* spinner */
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: -1px;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1d23;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      z-index: 1000;
      opacity: 0;
      transition: opacity .3s, transform .3s;
      pointer-events: none;
      max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #b91c1c; }
    .toast.success { background: #15803d; }

    .grid {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }

    .col-full { grid-column: 1 / -1; }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .3px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-header .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .card-header.sell .dot { background: var(--sell-accent); }
    .card-header.buy  .dot { background: var(--buy-accent); }
    .card-header.info .dot { background: #6366f1; }
    .card-header.levels .dot { background: var(--neutral-accent); }

    /* ── Signal banner ── */
    .signal-banner {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .signal-left { display: flex; align-items: center; gap: 12px; }

    .instrument { font-size: 22px; font-weight: 700; }

    .action-badge {
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .4px;
    }
    .action-badge.sell { background: var(--tag-down-bg); color: var(--tag-down-text); }
    .action-badge.buy  { background: var(--tag-up-bg);   color: var(--tag-up-text);  }
    .action-badge.no_trade { background: #f3f4f6; color: var(--muted); }
    .action-badge.watchlist { background: #e0e7ff; color: #3730a3; }

    .signal-right { text-align: right; }
    .current-price { font-size: 24px; font-weight: 700; letter-spacing: -.5px; }
    .price-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }

    /* ── KPI row ── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border);
    }
    @media (max-width: 480px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }

    .kpi {
      padding: 14px 16px;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 4px;
    }
    .kpi:last-child { border-right: none; }
    .kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
    .kpi-value { font-size: 16px; font-weight: 700; }
    .kpi-value.sell { color: var(--sell-accent); }
    .kpi-value.buy  { color: var(--buy-accent); }

    /* ── Confidence bar ── */
    .conf-row {
      padding: 12px 18px 14px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .conf-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .conf-track {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #e5e7eb;
      overflow: hidden;
    }
    .conf-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      transition: width .4s ease;
    }
    .conf-pct { font-size: 13px; font-weight: 600; white-space: nowrap; }

    /* ── Key-value table ── */
    .kv-table { width: 100%; border-collapse: collapse; }
    .kv-table tr { border-bottom: 1px solid var(--border); }
    .kv-table tr:last-child { border-bottom: none; }
    .kv-table td {
      padding: 11px 18px;
      font-size: 13.5px;
      vertical-align: middle;
    }
    .kv-table td:first-child {
      color: var(--muted);
      width: 44%;
      font-size: 13px;
    }
    .kv-table td:last-child {
      font-weight: 500;
      text-align: right;
    }

    /* ── Tags ── */
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .3px;
      margin-right: 5px;
      white-space: nowrap;
    }
    .tag.down    { background: var(--tag-down-bg);    color: var(--tag-down-text); }
    .tag.up      { background: var(--tag-up-bg);      color: var(--tag-up-text); }
    .tag.neutral { background: var(--tag-neutral-bg); color: var(--tag-neutral-text); }

    /* ── Key levels list ── */
    .levels-list { list-style: none; }
    .levels-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 13.5px;
      gap: 12px;
    }
    .levels-list li:last-child { border-bottom: none; }
    .level-label { color: var(--muted); flex: 1; min-width: 0; }
    .level-value { font-weight: 600; text-align: right; white-space: nowrap; }
    .level-value.resistance { color: var(--resistance-color); }
    .level-value.support    { color: var(--support-color); }

    /* ── Setup cards ── */
    .setups-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 0;
    }
    @media (max-width: 600px) { .setups-grid { grid-template-columns: 1fr; } }

    .setup-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .setup-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
    }
    .setup-card.sell::before { background: var(--sell-accent); }
    .setup-card.buy::before  { background: var(--buy-accent); }

    .setup-card-header {
      padding: 12px 16px 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .setup-title { font-size: 14px; font-weight: 700; }
    .setup-desc  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .conf-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      white-space: nowrap;
    }
    .conf-badge.high   { background: var(--tag-up-bg);      color: var(--tag-up-text); }
    .conf-badge.medium { background: var(--tag-neutral-bg); color: var(--tag-neutral-text); }
    .conf-badge.low    { background: var(--tag-down-bg);    color: var(--tag-down-text); }

    .setup-body { }
    .setup-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 9px 16px 9px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      gap: 10px;
    }
    .setup-row:last-child { border-bottom: none; }
    .setup-row-label { color: var(--muted); white-space: nowrap; min-width: 90px; padding-top: 1px; }
    .setup-row-value { font-weight: 500; text-align: right; line-height: 1.4; }
    .setup-row-value.price { font-weight: 700; font-variant-numeric: tabular-nums; }
    .setup-row-value.sell  { color: var(--sell-accent); }
    .setup-row-value.buy   { color: var(--buy-accent); }
    .setup-row-value.cancel { color: var(--neutral-accent); font-size: 12px; }
    .rr-tag {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
    }

    /* ── Meta row ── */
    .meta-row {
      max-width: 960px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    /* ── Thanh token usage / hạn mức ── */
    .usage-row {
      max-width: 960px;
      margin: 0 auto 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 14px;
      font-size: 12px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }
    .usage-item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .usage-item b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .usage-sep { width: 1px; height: 14px; background: var(--border); }
    .usage-low b { color: var(--sell-accent); }
    .usage-warn b { color: var(--neutral-accent); }
    .meta-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%  { opacity: .4; }
    }

    /* ── No data ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    /* ── History table ── */
    .history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .history-table th {
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .history-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .history-table tr:last-child td { border-bottom: none; }
    .history-table tr:hover td { background: #f9fafb; }
  </style>
</head>
<body>

<div class="page-header">
  <div class="page-title">
    AI Trading Signal
    <span id="lastUpdate"></span>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <a href="/chart" class="refresh-btn" style="text-decoration:none">📈 Biểu đồ</a>
    <a href="/docs" target="_blank" class="refresh-btn" style="text-decoration:none">📖 Docs</a>
    <button class="refresh-btn" onclick="loadLatest()">↻ Refresh</button>
    <button id="analyzeBtn" class="refresh-btn analyze-btn" onclick="runAnalyze('analyzeBtn')">⚡ Phân tích XAU</button>
    <button id="analyzeBtcBtn" class="refresh-btn btc-btn" onclick="runAnalyze('analyzeBtcBtn', 'BTC/USD')">₿ Phân tích BTC</button>
    <button id="swingBtn" class="refresh-btn" onclick="runSwing()">🔁 Nhịp nhỏ</button>
  </div>
</div>

<div id="metaRow" class="meta-row" style="display:none">
  <div class="meta-dot"></div>
  <span id="metaText"></span>
</div>

<div id="usageRow" class="usage-row" style="display:none"></div>

<!-- Nhịp nhỏ (zigzag pivot) — tính lại từ nến mỗi lần bấm, KHÔNG lưu DB nên không nằm
     trong loadLatest(); panel này tự render từ JSON của /api/swing. -->
<div class="grid" id="swingPanel" style="max-width:960px;margin:16px auto 0;display:none"></div>

<div id="main"></div>

<div id="toast" class="toast"></div>

<div class="grid" style="max-width:960px;margin:16px auto 0">
  <div class="card col-full" id="historyCard" style="display:none">
    <div class="card-header"><div class="dot"></div>Lịch sử tín hiệu</div>
    <div style="overflow-x:auto">
      <table class="history-table">
        <thead>
          <tr>
            <th>Thời gian</th><th>Hành động</th><th>Giá vào</th>
            <th>SL</th><th>TP1</th><th>R:R</th><th>Tin cậy</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const fmt = (n, d=2) => n == null ? '—' : Number(n).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function trendTag(val, detail) {
  if (!val) return '—';
  const v = val.toUpperCase();
  let cls = 'neutral';
  if (v.includes('GIẢM') || v.includes('BEARISH') || v.includes('DOWN')) cls = 'down';
  else if (v.includes('TĂNG') || v.includes('BULLISH') || v.includes('UP'))  cls = 'up';
  const detailHtml = detail ? `<span style="color:#6b7280;font-weight:400;margin-left:6px;font-size:12px">${esc(detail)}</span>` : '';
  return `<span class="tag ${cls}">${esc(val)}</span>${detailHtml}`;
}

function confBadgeClass(label) {
  if (!label) return 'medium';
  const l = label.toLowerCase();
  if (l.includes('cao') || l.includes('high')) return 'high';
  if (l.includes('thấp') || l.includes('low')) return 'low';
  return 'medium';
}

function renderSignalBanner(s) {
  const actionCls = s.action === 'BUY' ? 'buy' : s.action === 'SELL' ? 'sell' : s.action === 'WATCHLIST' ? 'watchlist' : 'no_trade';
  const actionLabel = s.action === 'BUY' ? '🟢 MUA (BUY)' : s.action === 'SELL' ? '🔴 BÁN (SELL)' : s.action === 'WATCHLIST' ? '👁 ĐANG CANH (WATCHLIST)' : '⚪ KHÔNG VÀO LỆNH';
  const bias = (s.trend_bias ?? '').toUpperCase();
  const biasIcon = bias === 'BULLISH' ? '📈' : bias === 'BEARISH' ? '📉' : '➖';

  return `
  <div class="card col-full">
    <div class="signal-banner">
      <div class="signal-left">
        <div class="instrument">${esc(s.instrument)}</div>
        <div class="action-badge ${actionCls}">${actionLabel}</div>
      </div>
      <div class="signal-right">
        <div class="price-label">Giá hiện tại</div>
        <div class="current-price">${fmt(s.current_price, 2)}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px">${biasIcon} ${bias || '—'}</div>
      </div>
    </div>
    ${(s.action === 'BUY' || s.action === 'SELL') ? `
    <div class="kpi-row">
      <div class="kpi">
        <div class="kpi-label">Entry</div>
        <div class="kpi-value">${fmt(s.entry, 2)}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Stop Loss</div>
        <div class="kpi-value sell">${fmt(s.stop_loss, 2)}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Take Profit</div>
        <div class="kpi-value buy">${fmt(s.take_profit, 2)}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">R : R</div>
        <div class="kpi-value">1 : ${fmt(s.risk_reward, 2)}</div>
      </div>
    </div>` : ''}
    ${s.confidence != null ? `
    <div class="conf-row">
      <div class="conf-label">Độ tin cậy AI</div>
      <div class="conf-track"><div class="conf-fill" style="width:${s.confidence}%"></div></div>
      <div class="conf-pct">${s.confidence}/100</div>
    </div>` : ''}
  </div>`;
}

function renderMarketStructure(ms) {
  if (!ms) return '';
  const rows = [
    ['Giá hiện tại',     ms.current_price ? `<strong>${esc(ms.current_price)}</strong>` : null],
    ['Xu hướng M5',      ms.trend_m5      ? trendTag(ms.trend_m5, ms.trend_m5_detail)  : null],
    ['Xu hướng M15',     ms.trend_m15     ? trendTag(ms.trend_m15, ms.trend_m15_detail): null],
    ['Cấu trúc',         ms.structure     ? `<span style="color:#b91c1c;font-weight:500">${esc(ms.structure)}</span>` : null],
    ['Vị trí so với MA', ms.ma_position   ? esc(ms.ma_position)  : null],
    ['RSI (M5)',         ms.rsi_m5        ? esc(ms.rsi_m5)       : null],
    ['Khối lượng',       ms.volume        ? esc(ms.volume)       : null],
  ].filter(([, v]) => v != null);

  if (!rows.length) return '';
  return `
  <div class="card">
    <div class="card-header info"><div class="dot"></div>Cấu trúc thị trường</div>
    <table class="kv-table">
      ${rows.map(([l, v]) => `<tr><td>${esc(l)}</td><td>${v}</td></tr>`).join('')}
    </table>
  </div>`;
}

function renderKeyLevels(levels) {
  if (!levels || !levels.length) return '';
  return `
  <div class="card">
    <div class="card-header levels"><div class="dot"></div>Các mức giá quan trọng</div>
    <ul class="levels-list">
      ${levels.map(lv => {
        const cls = lv.type === 'resistance' ? 'resistance' : lv.type === 'support' ? 'support' : '';
        return `<li>
          <span class="level-label">${esc(lv.label)}</span>
          <span class="level-value ${cls}">${esc(lv.value)}</span>
        </li>`;
      }).join('')}
    </ul>
  </div>`;
}

function renderSetups(setups) {
  if (!setups || !setups.length) return '';
  const sells = setups.filter(s => s.direction === 'SELL');
  const buys  = setups.filter(s => s.direction === 'BUY');
  let html = '';

  for (const [group, dir] of [[sells,'SELL'],[buys,'BUY']]) {
    if (!group.length) continue;
    const icon  = dir === 'SELL' ? '🔴' : '🟢';
    const label = dir === 'SELL' ? 'Lệnh Bán — SELL (Ưu tiên)' : 'Lệnh Mua — BUY (Ưu tiên)';
    const cls   = dir === 'SELL' ? 'sell' : 'buy';
    html += `
    <div class="card col-full">
      <div class="card-header ${cls}"><div class="dot"></div>${icon} ${label}</div>
      <div style="padding:16px">
        <div class="setups-grid">
          ${group.map(s => renderSetupCard(s, cls)).join('')}
        </div>
      </div>
    </div>`;
  }
  return html;
}

function renderSetupCard(s, cls) {
  const bc = confBadgeClass(s.confidence_label);
  const tp1Note = s.tp1?.note ? `<span style="color:var(--muted);font-size:11px;margin-left:4px">— ${esc(s.tp1.note)}</span>` : '';
  return `
  <div class="setup-card ${cls}">
    <div class="setup-card-header">
      <div>
        <div class="setup-title">${esc(s.label)}</div>
        <div class="setup-desc">${esc(s.description)}</div>
      </div>
      <div class="conf-badge ${bc}">Độ tin cậy: ${esc(s.confidence_label)}</div>
    </div>
    <div class="setup-body">
      <div class="setup-row">
        <div class="setup-row-label">Vùng vào lệnh</div>
        <div class="setup-row-value price ${cls}">${esc(s.entry_zone)}</div>
      </div>
      <div class="setup-row">
        <div class="setup-row-label">Điều kiện kích hoạt</div>
        <div class="setup-row-value" style="font-size:12px;color:#374151">${esc(s.trigger)}</div>
      </div>
      <div class="setup-row">
        <div class="setup-row-label">Cắt lỗ (SL)</div>
        <div class="setup-row-value price sell">${fmt(s.stop_loss,2)}${s.stop_loss_note ? `<span style="font-size:11px;font-weight:400;color:var(--muted)"> — ${esc(s.stop_loss_note)}</span>` : ''}</div>
      </div>
      ${s.tp1 ? `<div class="setup-row">
        <div class="setup-row-label">TP1 ${s.tp1.rr ? `<span class="rr-tag">${esc(s.tp1.rr)}</span>` : ''}</div>
        <div class="setup-row-value price buy">${fmt(s.tp1.value,2)}${tp1Note}</div>
      </div>` : ''}
      ${s.tp2 ? `<div class="setup-row">
        <div class="setup-row-label">TP2 ${s.tp2.rr ? `<span class="rr-tag">${esc(s.tp2.rr)}</span>` : ''}</div>
        <div class="setup-row-value price buy">${fmt(s.tp2.value,2)}</div>
      </div>` : ''}
      ${s.tp3 ? `<div class="setup-row">
        <div class="setup-row-label">TP3 ${s.tp3.rr ? `<span class="rr-tag">${esc(s.tp3.rr)}</span>` : ''}</div>
        <div class="setup-row-value price buy">${esc(String(s.tp3.value))}</div>
      </div>` : ''}
      <div class="setup-row">
        <div class="setup-row-label">Hủy setup nếu</div>
        <div class="setup-row-value cancel">${esc(s.cancel_condition)}</div>
      </div>
    </div>
  </div>`;
}

function renderConditionalSetups(setups) {
  if (!setups || !setups.length) return '';
  return setups.map(s => {
    const lines = String(s.rawText || '').split('\n').map(l => l.trim()).filter(Boolean);
    let title = '';
    const items = [];
    for (const ln of lines) {
      const h = ln.match(/^#+\s*(.+)$/);
      if (h) { title = h[1]; continue; }
      items.push(ln.replace(/^[-*]\s*/, ''));
    }
    return `
    <div class="card col-full">
      <div class="card-header levels"><div class="dot"></div>👁 ${esc(title || 'Đang canh (Watchlist)')}</div>
      <ul class="levels-list">
        ${items.map(it => {
          const idx = it.indexOf(':');
          if (idx > -1) {
            return `<li><span class="level-label">${esc(it.slice(0, idx).trim())}</span><span class="level-value">${esc(it.slice(idx + 1).trim())}</span></li>`;
          }
          return `<li><span class="level-label">${esc(it)}</span></li>`;
        }).join('')}
      </ul>
    </div>`;
  }).join('');
}

function renderHistory(signals) {
  if (!signals || signals.length < 2) return;
  const card = document.getElementById('historyCard');
  const body = document.getElementById('historyBody');
  card.style.display = '';
  body.innerHTML = signals.slice(1).map(s => {
    const actionCls = s.action === 'BUY' ? 'buy' : s.action === 'SELL' ? 'sell' : '';
    const timeStr = new Date(s.created_at).toLocaleString('vi-VN', {timeZone:'Asia/Ho_Chi_Minh',hour12:false});
    return `<tr>
      <td style="color:var(--muted);font-size:12px">${timeStr}</td>
      <td><span class="tag ${actionCls === 'buy' ? 'up' : actionCls === 'sell' ? 'down' : 'neutral'}">${s.action}</span></td>
      <td>${fmt(s.entry,2)}</td>
      <td style="color:var(--sell-accent)">${fmt(s.stop_loss,2)}</td>
      <td style="color:var(--buy-accent)">${fmt(s.take_profit,2)}</td>
      <td>${s.risk_reward ? '1:'+fmt(s.risk_reward,2) : '—'}</td>
      <td>${s.confidence != null ? s.confidence+'%' : '—'}</td>
    </tr>`;
  }).join('');
}

function fmtTok(n) {
  if (n == null) return '—';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(2) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'k';
  return String(n);
}

/** Nhãn "còn lại / hạn mức (xx%)" + tô màu khi tụt dưới ngưỡng. */
function remainItem(label, remaining, limit, resetAt) {
  if (remaining == null) return '';
  const pct = limit ? Math.round((remaining / limit) * 100) : null;
  const cls = pct == null ? '' : pct <= 10 ? ' usage-low' : pct <= 30 ? ' usage-warn' : '';
  const resetStr = resetAt
    ? ` · reset ${new Date(resetAt).toLocaleTimeString('vi-VN', {timeZone:'Asia/Ho_Chi_Minh',hour12:false,hour:'2-digit',minute:'2-digit'})}`
    : '';
  return `<span class="usage-item${cls}" title="Hạn mức Anthropic còn lại${resetStr}">${label}
    <b>${fmtTok(remaining)}${limit ? ' / ' + fmtTok(limit) : ''}</b>${pct != null ? ` (${pct}%)` : ''}</span>`;
}

const WINDOW_LABEL = {
  five_hour: 'cửa sổ 5h',
  seven_day: 'tuần',
  seven_day_opus: 'tuần (Opus)',
  seven_day_sonnet: 'tuần (Sonnet)',
  seven_day_overage_included: 'tuần (gồm vượt mức)',
  overage: 'vượt mức',
};

/**
 * Hạn mức gói subscription: Anthropic chỉ cho biết ĐÃ DÙNG bao nhiêu % của cửa sổ,
 * không cho biết còn bao nhiêu token → quy về "còn lại %" cho dễ đọc.
 */
function subscriptionItem(rl) {
  const win = WINDOW_LABEL[rl.windowType] || rl.windowType || 'gói';
  const reset = rl.resetsAt
    ? ' · reset ' + new Date(rl.resetsAt).toLocaleString('vi-VN', {timeZone:'Asia/Ho_Chi_Minh',hour12:false,hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})
    : '';
  if (rl.utilizationPct == null) {
    const st = rl.status === 'rejected' ? 'đã hết hạn mức' : rl.status === 'allowed_warning' ? 'sắp hết' : 'còn dùng được';
    return `<span class="usage-item" title="Gói Claude Pro/Max">Gói: ${st}${reset}</span>`;
  }
  const left = Math.max(0, Math.round(100 - rl.utilizationPct));
  const cls = left <= 10 ? ' usage-low' : left <= 30 ? ' usage-warn' : '';
  return `<span class="usage-item${cls}" title="Hạn mức gói Claude (đã dùng ${Math.round(rl.utilizationPct)}%)${reset}">
    Gói còn <b>${left}%</b> (${win})${reset}</span>`;
}

function renderUsage(u) {
  const row = document.getElementById('usageRow');
  if (!u || u.error) { row.style.display = 'none'; return; }

  const t = u.today || {};
  const parts = [
    `<span class="usage-item" title="Cộng dồn các lượt phân tích trong ngày (giờ VN)">📊 Hôm nay <b>${t.runs || 0}</b> lượt</span>`,
    `<span class="usage-item">↓ Input <b>${fmtTok(t.input_tokens)}</b></span>`,
    `<span class="usage-item">↑ Output <b>${fmtTok(t.output_tokens)}</b></span>`,
  ];
  if (t.cache_read_tokens) parts.push(`<span class="usage-item" title="Token đọc lại từ prompt cache">⚡ Cache <b>${fmtTok(t.cache_read_tokens)}</b></span>`);

  const last = u.last_run && u.last_run.usage;
  if (last) {
    parts.push('<span class="usage-sep"></span>');
    parts.push(`<span class="usage-item" title="Lượt gần nhất: ${u.last_run.symbol}">Lượt cuối <b>${fmtTok(last.total_input_tokens)}↓ / ${fmtTok(last.output_tokens)}↑</b></span>`);
  }

  const rl = u.rate_limit;
  parts.push('<span class="usage-sep"></span>');
  if (rl && rl.source === 'api-headers') {
    parts.push(remainItem('Còn input', rl.inputTokensRemaining, rl.inputTokensLimit, rl.inputTokensReset));
    parts.push(remainItem('Còn output', rl.outputTokensRemaining, rl.outputTokensLimit, rl.outputTokensReset));
    parts.push(remainItem('Còn token', rl.tokensRemaining, rl.tokensLimit, rl.tokensReset));
    parts.push(remainItem('Còn request', rl.requestsRemaining, rl.requestsLimit, rl.requestsReset));
  } else if (rl && rl.source === 'subscription') {
    parts.push(subscriptionItem(rl));
  } else {
    // Hạn mức đọc từ lượt gọi Claude gần nhất → chưa có gì cho tới lượt đầu tiên.
    parts.push('<span class="usage-item" title="Cập nhật sau lượt phân tích đầu tiên kể từ khi khởi động server">Hạn mức: chưa đo</span>');
  }

  row.innerHTML = parts.filter(Boolean).join('');
  row.style.display = 'flex';
}

async function loadUsage() {
  try {
    renderUsage(await fetch('/api/usage').then(r => r.json()));
  } catch {
    document.getElementById('usageRow').style.display = 'none';
  }
}

async function loadLatest() {
  try {
    const [latest, all] = await Promise.all([
      fetch('/api/signals/latest').then(r => r.json()),
      fetch('/api/signals?limit=10').then(r => r.json()),
    ]);

    if (latest.error) {
      document.getElementById('main').innerHTML = `<div class="grid"><div class="card col-full"><div class="empty">Chưa có tín hiệu nào.<br>Chạy <code>npm run analyze:force</code> để tạo tín hiệu đầu tiên.</div></div></div>`;
      loadUsage();
      return;
    }

    const timeStr = new Date(latest.created_at).toLocaleString('vi-VN', {timeZone:'Asia/Ho_Chi_Minh',hour12:false});
    document.getElementById('lastUpdate').textContent = '';
    document.getElementById('metaRow').style.display = 'flex';
    document.getElementById('metaText').textContent = `Tín hiệu mới nhất: ${timeStr} (Giờ VN)`;

    const html = `
    <div class="grid">
      ${renderSignalBanner(latest)}
      ${latest.action === 'WATCHLIST' ? renderConditionalSetups(latest.conditional_setups) : ''}
      ${renderMarketStructure(latest.market_structure)}
      ${renderKeyLevels(latest.key_levels)}
      ${renderSetups(latest.setups)}
    </div>`;

    document.getElementById('main').innerHTML = html;
    renderHistory(all);
    loadUsage();
  } catch (e) {
    document.getElementById('main').innerHTML = `<div class="grid"><div class="card col-full"><div class="empty">Không thể kết nối server. Hãy chắc chắn server đang chạy.</div></div></div>`;
  }
}

let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 4000);
}

function getApiKey() {
  return localStorage.getItem('apiKey') || '';
}

function promptApiKey() {
  const key = prompt('Nhập API key (API_SERVER_KEY) để chạy phân tích:', getApiKey());
  if (key != null) localStorage.setItem('apiKey', key.trim());
  return getApiKey();
}

async function runAnalyze(btnId = 'analyzeBtn', symbol, endpoint = '/api/analyze') {
  const btn = document.getElementById(btnId);
  if (btn.disabled) return;
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Đang phân tích...';
  const label = symbol ? symbol : 'XAU/USD';
  showToast(`Đang gửi yêu cầu phân tích ${label}, vui lòng đợi...`);

  const payload = symbol ? { symbol } : {};

  try {
    const headers = { 'Content-Type': 'application/json' };
    const apiKey = getApiKey();
    if (apiKey) headers['x-api-key'] = apiKey;

    let res = await fetch(endpoint, {
      method: 'POST',
      headers,
      body: JSON.stringify(payload),
    });

    // Nếu cần key mà chưa có/sai → hỏi key rồi thử lại 1 lần
    if (res.status === 401) {
      const key = promptApiKey();
      if (!key) throw new Error('Cần API key để chạy phân tích');
      res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': key },
        body: JSON.stringify(payload),
      });
    }

    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Phân tích thất bại');

    const tok = data.usage
      ? ` · ${fmtTok(data.usage.total_input_tokens)}↓ / ${fmtTok(data.usage.output_tokens)}↑`
      : '';
    showToast(`✓ Phân tích hoàn tất (${(data.duration_ms / 1000).toFixed(1)}s${tok})`, 'success');
    await loadLatest();
  } catch (e) {
    showToast('✗ ' + (e.message || 'Phân tích thất bại'), 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

// ─── Nhịp nhỏ (zigzag pivot, không dùng AI) ─────────────────────────────────

async function runSwing(symbol) {
  const btn = document.getElementById('swingBtn');
  if (btn.disabled) return;
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Đang dò...';

  const url = '/api/swing' + (symbol ? `?symbol=${encodeURIComponent(symbol)}` : '');
  try {
    const call = key => fetch(url, { headers: key ? { 'x-api-key': key } : {} });
    let res = await call(getApiKey());
    if (res.status === 401) {
      const key = promptApiKey();
      if (!key) throw new Error('Cần API key để dò nhịp');
      res = await call(key);
    }
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Dò nhịp thất bại');

    renderSwing(data);
    showToast(`✓ ${data.stats.total} nhịp trong ${data.duration_ms}ms`, 'success');
  } catch (e) {
    showToast('✗ ' + (e.message || 'Dò nhịp thất bại'), 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

// "2026-08-27 02:00:00" → "02:00 27/08" (mọi nến trong báo cáo đều thuộc vài phiên gần nhất).
const swingTime = t => {
  const m = String(t ?? '').match(/(\d{2})-(\d{2})[T ](\d{2}:\d{2})/);
  return m ? `${m[3]} ${m[2]}/${m[1]}` : (t ?? '—');
};

const swingR = n => `${n >= 0 ? '+' : ''}${n}R`;
const swingPct = n => n == null ? '—' : n + '%';

// status = ĐƯỜNG ĐI với SL gốc (SL / chạm đủ TP / còn chạy); resultR = kết quả theo
// LUẬT THOÁT đang chọn. Nói rõ "SL sau TP{n}" vì đó chính là chi phí của việc giữ lệnh.
const swingStatus = s => {
  if (s.status === 'SL') {
    const label = s.maxTpHit ? `SL sau TP${s.maxTpHit}` : 'SL';
    return `<span class="tag down">${label} ${swingR(s.resultR)}</span>`;
  }
  if (s.status === 'RUNNING') return `<span class="tag neutral">chạy ${swingR(s.resultR)}</span>`;
  return `<span class="tag up">${s.status} ${swingR(s.resultR)}</span>`;
};

function renderSwing(data) {
  const { latest, stats, signals, params } = data;
  const dirCls = latest ? latest.direction.toLowerCase() : 'no_trade';
  const head = latest
    ? `${latest.direction === 'BUY' ? '🟢 BUY' : '🔴 SELL'} @ ${fmt(latest.entry)}`
    : '⚪ Chưa có nhịp';

  // Tín hiệu quá cũ hoặc đã chốt → vẫn hiện nhưng ghi rõ không vào được nữa.
  const note = !latest ? 'Không có nhịp nào đủ lớn so với ngưỡng lọc.'
    : data.actionable ? `Còn vào được — tín hiệu ra cách đây ${latest.barsAgo} nến.`
    : latest.status !== 'RUNNING' ? `Nhịp này đã đóng (${latest.status}) — chờ pivot mới.`
    : `Đã ra cách đây ${latest.barsAgo} nến, giá rời entry quá xa — chờ nhịp mới.`;

  const detail = latest ? `
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">Entry</div><div class="kpi-value">${fmt(latest.entry)}</div></div>
      <div class="kpi"><div class="kpi-label">Stop loss</div><div class="kpi-value sell">${fmt(latest.stopLoss)}</div></div>
      <div class="kpi"><div class="kpi-label">TP1 / TP2 / TP3</div><div class="kpi-value buy">${latest.takeProfits.map(t => fmt(t)).join(' · ')}</div></div>
      <div class="kpi"><div class="kpi-label">1R</div><div class="kpi-value">${fmt(latest.risk)}</div></div>
      <div class="kpi"><div class="kpi-label">Độ lớn nhịp</div><div class="kpi-value">${latest.legAtr}× ATR</div></div>
    </div>
    ${latest.provisional ? '<div class="meta-row" style="margin-top:10px">⚠️ Nhịp đảo chiều chưa đủ lớn — pivot còn có thể bị dời (repaint).</div>' : ''}
  ` : '';

  // "Giữ tới TP xa có đáng không" — trả lời bằng xác suất có điều kiện và bảng so sánh
  // luật thoát, thay vì để người đọc tự đoán từ winrate gộp.
  const cond = stats.conditional || { reachedTp1: 0, levels: [], giveBack: 0, giveBackPct: null };
  const ruleRows = Object.entries(data.exit_rules || {}).map(([key, label]) => {
    const r = (stats.byRule || {})[key];
    if (!r) return '';
    const active = key === params.exitRule;
    return `<tr${active ? ' style="font-weight:600"' : ''}>
      <td>${esc(label)}${active ? ' ◀' : ''}</td><td>${r.closed}</td>
      <td>${swingPct(r.winRatePct)}</td><td>${swingR(r.totalR)}</td>
      <td>${r.avgR == null ? '—' : swingR(r.avgR)}</td></tr>`;
  }).join('');

  const holdBlock = !stats.total ? '' : `
    <div style="margin-top:14px;padding:12px;border:1px solid var(--border);border-radius:8px">
      <div style="font-weight:600;margin-bottom:8px">Giữ tới TP xa có đáng không?</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.7">
        ${cond.reachedTp1
          ? `${cond.reachedTp1}/${stats.total} lệnh chạm TP1. `
            + cond.levels.map(l => `Đi tiếp tới <b>TP${l.level}: ${swingPct(l.pctGivenTp1)}</b>`).join(' · ')
            + `<br>Chạm TP1 rồi vẫn về SL gốc: <b>${cond.giveBack}/${cond.reachedTp1} (${swingPct(cond.giveBackPct)})</b>`
          : 'Chưa lệnh nào chạm TP1 trong bộ nến này — không đủ dữ liệu.'}
        <br>MFE trung vị <b>${stats.mfeMedianR == null ? '—' : stats.mfeMedianR + 'R'}</b>
        · MAE trung vị ${stats.maeMedianR == null ? '—' : stats.maeMedianR + 'R'}
      </div>
      <div style="overflow-x:auto;margin-top:10px">
        <table class="history-table">
          <thead><tr><th>Luật thoát</th><th>Đã đóng</th><th>Winrate</th><th>Tổng R</th><th>R/lệnh</th></tr></thead>
          <tbody>${ruleRows}</tbody>
        </table>
      </div>
    </div>`;

  document.getElementById('swingPanel').innerHTML = `
    <div class="card col-full">
      <div class="card-header"><div class="dot"></div>🔁 Nhịp nhỏ — ${esc(data.symbol)} · ${esc(data.timeframe)}
        <span style="margin-left:auto;font-weight:400;color:var(--muted);font-size:11px">
          pivot ${params.pivotLookback} nến · lọc ≥ ${params.minLegAtr}× ATR · SL đệm ${params.slBufferAtr}× ATR
        </span>
      </div>
      <div class="signal-banner">
        <div class="signal-left">
          <span class="action-badge ${dirCls}">${head}</span>
          <span style="color:var(--muted);font-size:12px">${esc(note)}</span>
        </div>
        <div class="signal-right">
          <div class="price-label">Winrate / Tổng R (${stats.resolved} nhịp đã đóng)</div>
          <div class="current-price">${stats.winRatePct == null ? '—' : stats.winRatePct + '%'}
            <span style="font-size:15px;color:var(--muted)">/ ${stats.totalR >= 0 ? '+' : ''}${stats.totalR}R</span></div>
        </div>
      </div>
      ${detail}
      ${holdBlock}
      <div style="overflow-x:auto;margin-top:12px">
        <table class="history-table">
          <thead><tr><th>Xác nhận</th><th>Chiều</th><th>Entry</th><th>SL</th><th>TP1</th><th>Nhịp</th><th>MFE</th><th>Kết quả</th></tr></thead>
          <tbody>${signals.slice(-15).reverse().map(s => `
            <tr>
              <td>${esc(swingTime(s.signalTime))}</td>
              <td class="kpi-value ${s.direction.toLowerCase()}" style="font-size:13px">${s.direction}</td>
              <td>${fmt(s.entry)}</td><td>${fmt(s.stopLoss)}</td><td>${fmt(s.takeProfits[0])}</td>
              <td>${s.legAtr}×</td><td>${s.mfeR}R</td><td>${swingStatus(s)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div style="margin-top:10px;font-size:11px;color:var(--muted)">
        Tín hiệu cơ học, không đọc bối cảnh POI/thanh khoản như phân tích AI.
        Winrate đo trên chính đoạn nến đang xét (backtest trong mẫu) — dùng để chỉnh tham số, không phải kỳ vọng tương lai.
      </div>
    </div>`;
  document.getElementById('swingPanel').style.display = '';
}

loadLatest();
setInterval(loadLatest, 60_000);
