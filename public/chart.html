<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Trading Signal — Biểu đồ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --border: #e8eaed;
      --text: #1a1d23;
      --muted: #6b7280;
      --buy-accent: #22c55e;
      --sell-accent: #ef4444;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .page-title { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
    .page-title span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }

    .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .nav-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
      text-decoration: none;
      transition: background .15s;
    }
    .nav-btn:hover { background: #f3f4f6; }

    .analyze-btn {
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      color: #fff;
      border: 1px solid transparent;
      font-weight: 600;
    }
    .analyze-btn:hover { background: linear-gradient(90deg, #4f46e5, #7c3aed); }
    .analyze-btn:disabled { opacity: .6; cursor: not-allowed; }

    .plan-btn {
      background: linear-gradient(90deg, #0d9488, #0891b2);
      color: #fff;
      border: 1px solid transparent;
      font-weight: 600;
    }
    .plan-btn:hover { background: linear-gradient(90deg, #0f766e, #0e7490); }
    .plan-btn:disabled { opacity: .6; cursor: not-allowed; }

    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: -1px;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: #1a1d23; color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      z-index: 1000;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      max-width: 90vw;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #b91c1c; }
    .toast.success { background: #15803d; }

    /* ── Thanh symbol ngang, cuộn được, nằm trên chart ── */
    .symbols-bar-wrap {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
    }
    .symbols-bar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 16px 8px;
    }
    .symbols-bar-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .3px;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0;
    }
    .symbols-bar-controls { display: flex; align-items: center; gap: 8px; }
    .symbols-bar-controls input {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      outline: none;
      color: var(--text);
      width: 160px;
    }
    .symbols-bar-controls input:focus { border-color: #6366f1; }

    .symbols-bar {
      list-style: none;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 16px 12px;
    }
    .symbols-bar::-webkit-scrollbar { height: 6px; }
    .symbols-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .symbol-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding: 7px 8px 7px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      transition: background .12s, border-color .12s;
      white-space: nowrap;
    }
    .symbol-pill:hover { background: #f9fafb; }
    .symbol-pill.active { background: #eef2ff; border-color: #6366f1; }
    .symbol-star { font-size: 12px; flex-shrink: 0; }
    .symbol-code { font-size: 13px; font-weight: 700; }
    .symbol-tag {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: .3px;
    }
    .symbol-tag.crypto { background: #fef3c7; color: #b45309; }
    .symbol-tag.fx { background: #dbeafe; color: #1d4ed8; }

    .symbol-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .symbol-del {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      width: 22px; height: 22px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .12s, color .12s;
    }
    .symbol-del:hover { background: #fee2e2; color: var(--sell-accent); }

    .symbol-signals {
      border: none;
      background: transparent;
      font-size: 13px;
      line-height: 1;
      width: 22px; height: 22px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .12s;
    }
    .symbol-signals:hover { background: #eef2ff; }

    /* ── Layout: chart trái, nhịp nhỏ phải ── */
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      padding: 16px;
      min-height: 0;
    }
    .chart-card, .swing-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chart-card { padding: 0; }
    #tv_chart { flex: 1; min-height: 0; }

    .swing-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .live-clock {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      background: #f3f4f6;
      padding: 3px 9px;
      border-radius: 6px;
      transition: background .2s, color .2s;
    }
    .swing-body {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
      padding: 12px 14px;
    }

    /* ── Mobile: xếp chồng, nhịp nhỏ xuống dưới chart ── */
    @media (max-width: 820px) {
      .page-header { padding: 10px 14px; gap: 8px; }
      .page-title { font-size: 16px; }
      .page-title span { display: block; margin-left: 0; margin-top: 2px; }
      .nav-btn { padding: 7px 11px; font-size: 12px; }

      .symbols-bar-controls input { width: 120px; }

      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(260px, 1fr) minmax(220px, 40vh);
        gap: 10px;
        padding: 10px;
      }
    }

    .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }

    /* ── Modal danh sách tín hiệu từ Claude ── */
    .sig-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 60;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .sig-overlay.show { display: flex; }
    .sig-modal {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
      width: min(720px, 100%);
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sig-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sig-modal-title { font-size: 15px; font-weight: 700; }
    .sig-modal-title span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
    .sig-modal-close {
      border: none; background: transparent;
      font-size: 24px; line-height: 1; color: var(--muted);
      cursor: pointer; width: 32px; height: 32px; border-radius: 6px;
    }
    .sig-modal-close:hover { background: #f3f4f6; }
    .sig-modal-body { overflow-y: auto; padding: 14px 18px; }
    .sig-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .sig-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      background: #f9fafb;
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
    }
    .sig-item-time { font-weight: 600; color: var(--text); }
    /* Token của từng lượt phân tích, nằm cạnh thời gian trong header bản ghi */
    .sig-tok {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .sig-tok b { color: var(--text); font-weight: 600; }
    /* Dải tổng token trong ngày, ngay đầu modal */
    .sig-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
    }
    .sig-summary b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .sig-summary .sep { width: 1px; height: 13px; background: var(--border); }
    .sig-item-body { padding: 12px 14px; font-size: 13px; line-height: 1.6; display: none; }
    .sig-item.open .sig-item-body { display: block; }
    .sig-item-body table { border-collapse: collapse; width: 100%; margin: 6px 0; }
    .sig-item-body th, .sig-item-body td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
    .sig-item-body b, .sig-item-body strong { color: var(--text); }
    .sig-item-body i, .sig-item-body em { color: var(--muted); }
    /* HTML từ server dùng ký tự xuống dòng "\n" (chuẩn Telegram) → giữ nguyên để hiển thị đúng format */
    .sig-setup, .sig-reasoning { white-space: pre-wrap; word-break: break-word; }
    .sig-setup { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--border); }
    .sig-toggle { font-size: 16px; color: var(--muted); transition: transform .15s; }
    .sig-item.open .sig-toggle { transform: rotate(90deg); }

    /* ── Add coin ── */
    .add-btn {
      background: #eef2ff;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: #4f46e5;
      cursor: pointer;
    }
    .add-btn:hover { background: #e0e7ff; }

    .add-panel { border-bottom: 1px solid var(--border); background: #fafbff; display: none; }
    .add-panel.open { display: block; }
    .add-panel .add-input-row { padding: 10px 12px; }
    .add-panel input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
      color: var(--text);
    }
    .add-panel input:focus { border-color: #6366f1; }
    .add-results { list-style: none; max-height: 240px; overflow-y: auto; }
    .add-result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 14px;
      border-top: 1px solid var(--border);
      font-size: 13px;
    }
    .add-result-item .ar-meta { min-width: 0; }
    .add-result-item .ar-code { font-weight: 700; }
    .add-result-item .ar-name { font-size: 11px; color: var(--muted); }
    .add-result-item .ar-add {
      background: var(--buy-accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .add-result-item .ar-add:disabled { background: #cbd5e1; cursor: default; }
    .add-hint { padding: 8px 14px; font-size: 12px; color: var(--muted); }

    /* ── Theo dõi SetupWatcher (chuỗi sweep → CHoCH → retest) ── */
    .watch-btn.st-retest { background: #dcfce7; border-color: #22c55e; color: #15803d; font-weight: 600; }
    .watch-btn.st-confirmed { background: #fef3c7; border-color: #f59e0b; color: #b45309; }
    .watch-btn.st-off { opacity: .6; }
    .w-alert { border-radius: 8px; padding: 8px 12px; font-size: 12px; margin-bottom: 12px; line-height: 1.5; }
    .w-alert.err { background: #fee2e2; color: #b91c1c; }
    .w-alert.info { background: #eef2ff; color: #3730a3; }
    .w-sym { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .w-sym-head {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
      padding: 10px 14px; background: #f9fafb; font-size: 12px; color: var(--muted);
    }
    .w-sym-head b { color: var(--text); font-size: 14px; }
    .w-sym-head .w-upd { margin-left: auto; }
    .w-dir { padding: 12px 14px; border-top: 1px solid var(--border); font-size: 13px; }
    .w-dir-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 8px; }
    .w-dir-name { font-weight: 700; min-width: 42px; }
    .w-dir-name.buy { color: #15803d; }
    .w-dir-name.sell { color: #b91c1c; }
    .w-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .w-step {
      font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 12px;
      background: #f3f4f6; color: #9ca3af; white-space: nowrap;
    }
    .w-step.done { background: #dcfce7; color: #15803d; }
    .w-step.now { background: #fef3c7; color: #b45309; }
    .w-arrow { color: #d1d5db; font-size: 11px; }
    .w-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; text-transform: uppercase; letter-spacing: .3px; }
    .w-tag.bias-ok { background: #dcfce7; color: #15803d; }
    .w-tag.bias-neutral { background: #fef3c7; color: #b45309; }
    .w-tag.bias-no { background: #fee2e2; color: #b91c1c; }
    .w-note { color: var(--text); margin-bottom: 6px; }
    .w-facts { list-style: none; font-size: 12px; color: var(--muted); line-height: 1.7; }
    .w-facts b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .w-tabbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      padding: 10px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .w-tab {
      border: 1px solid var(--border); background: var(--card); color: var(--muted);
      border-radius: 8px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .w-tab.active { background: #eef2ff; border-color: #6366f1; color: #4338ca; }
    /* Hàng tab symbol — lọc cả "Hiện tại" lẫn "Lịch sử" */
    .w-symtabs {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      padding: 8px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .w-symtab {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--border); background: var(--card); color: var(--muted);
      border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .w-symtab.active { background: #eef2ff; border-color: #6366f1; color: #4338ca; }
    .w-symtab .w-dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; }
    .w-symtab .w-dot.s1 { background: #60a5fa; }
    .w-symtab .w-dot.s2 { background: #f59e0b; }
    .w-symtab .w-dot.s3 { background: #22c55e; }
    .w-symtab .w-cnt { font-weight: 400; font-size: 11px; }
    .w-tabbar input[type="date"] {
      margin-left: auto; border: 1px solid var(--border); border-radius: 8px;
      padding: 4px 8px; font-size: 12px; color: var(--text);
    }
    .w-ev { border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; }
    .w-ev-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 4px; }
    .w-ev-time { font-weight: 700; font-variant-numeric: tabular-nums; }
    .w-ev-sym { color: var(--muted); font-size: 12px; }
    .w-ev .w-step { font-size: 11px; }
    .w-step.dead { background: #fee2e2; color: #b91c1c; }
    .w-ev-res { font-size: 12px; margin-top: 6px; }
    .w-ev-res.fired { color: #15803d; font-weight: 600; }
    .w-ev-res.skip { color: #b45309; }
    .w-tabbar select {
      border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 12px; color: var(--text); background: var(--card);
    }
    /* Mỗi lần dò (tick) một dòng; các lần đổi bước của tick đó lồng bên dưới */
    .w-tick { border-left: 3px solid var(--border); padding: 6px 0 6px 10px; margin-bottom: 4px; font-size: 12px; }
    .w-tick.idle { color: var(--muted); }
    .w-tick.has-ev { border-left-color: #f59e0b; }
    .w-tick.o-TRIGGERED { border-left-color: #22c55e; }
    .w-tick.o-ERROR { border-left-color: #ef4444; }
    .w-tick-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
    .w-tick-top .w-step { font-size: 10px; padding: 2px 7px; }
    .w-tick-out { font-weight: 600; }
    .w-tick-out.TRIGGERED { color: #15803d; }
    .w-tick-out.SKIPPED { color: #b45309; }
    .w-tick-out.ERROR { color: #b91c1c; }
    .w-tick-out.BUSY { color: var(--muted); }
    .w-tick-reason { margin-top: 3px; color: var(--muted); }
    .w-tick details { margin-top: 3px; }
    .w-tick summary { cursor: pointer; color: var(--muted); font-size: 11px; }
    .w-tick details div { color: var(--text); margin: 2px 0 0 12px; }
    .w-tick .w-ev { margin: 6px 0 2px; }
    /* Nguồn kích hoạt trên modal tín hiệu Claude */
    .trig-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: #f3f4f6; color: var(--muted); }
    .trig-badge.event { background: #dcfce7; color: #15803d; }
    .trig-badge.plan { background: #dbeafe; color: #1d4ed8; }
  </style>
</head>
<body>

<div class="page-header">
  <div class="page-title">
    📈 Biểu đồ
    <span id="currentSymbol"></span>
  </div>
  <div class="header-actions">
    <button id="schedulerToggleBtn" class="nav-btn" onclick="toggleScheduler()" disabled>⏱ …</button>
    <button id="watcherBtn" class="nav-btn watch-btn" onclick="openWatcher()" title="Theo dõi chuỗi sweep → CHoCH → retest">🎯 Watcher</button>
    <button id="planBtn" class="nav-btn plan-btn" onclick="runDailyPlanAll()" title="Lập kế hoạch ngày (bias + kịch bản BUY/SELL) cho mọi symbol của DAILY_PLAN_SYMBOLS, lần lượt">🗺 Kế hoạch ngày</button>
    <button id="analyzeBtn" class="nav-btn analyze-btn" onclick="runAnalyze()">⚡ Phân tích</button>
    <a href="/" class="nav-btn">🏠 Tín hiệu</a>
    <a href="/docs" target="_blank" class="nav-btn">📖 Docs</a>
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="sigOverlay" class="sig-overlay" onclick="if(event.target===this) closeSignals()">
  <div class="sig-modal">
    <div class="sig-modal-header">
      <div class="sig-modal-title"><span id="sigTitle">📋 Tín hiệu từ Claude</span> <span id="sigSymbol"></span></div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const CRYPTO_BASES = ['BTC','ETH','BNB','SOL','XRP','ADA','DOGE','LTC','AVAX','DOT','MATIC','LINK','TRX'];

let symbols = [];
let activeSymbol = null;
let tvWidget = null;
// Khung của kết quả nhịp nhỏ đang hiển thị trong panel — đọc lại từ interval hiện tại
// của chart ở MỖI lần bấm 🔄 (panel không tự dò lại, xem runSwing()).
let swingTimeframe = null;
// Interval TradingView đang hiển thị (vd '5', '15', '60', 'D') — nhịp nhỏ dùng đúng khung
// này thay vì SWING_TIMEFRAME cố định trong .env. Nhớ lại giữa các lần đổi symbol/reload.
let currentInterval = localStorage.getItem('chartInterval') || '5';

// TradingView resolution ('1','5','15','60','240','D','W'…) → timeframe hệ thống hiểu
// (M1/M5/M15/M30/H1/H4/D/W, xem TIMEFRAME_MAP trong TwelveDataProvider). Làm tròn về
// mốc gần nhất khi người dùng chọn interval TradingView không có sẵn trong hệ thống.
function tvIntervalToTimeframe(interval) {
  const s = String(interval ?? '5').trim().toUpperCase();
  if (s === 'D' || s === '1D') return 'D';
  if (s === 'W' || s === '1W') return 'W';
  if (s === 'M' || s === '1M' || s === '1MO') return 'D'; // monthly chưa hỗ trợ → fallback D
  const min = parseInt(s, 10);
  if (Number.isNaN(min)) return 'M5';
  if (min <= 2) return 'M1';
  if (min <= 10) return 'M5';
  if (min <= 20) return 'M15';
  if (min <= 45) return 'M30';
  if (min <= 90) return 'H1';
  if (min < 1440) return 'H4';
  return 'D';
}

/**
 * Widget embed công khai (tv.js) không expose activeChart()/onIntervalChanged() — chỉ
 * getSymbolInfo(callback) là API còn hỏi được interval hiện tại của chart, và nó hỏi
 * "sống" qua postMessage vào iframe nên luôn phản ánh đúng lựa chọn mới nhất của người
 * dùng (kể cả khi họ vừa đổi timeframe trên chart mà chưa reload trang).
 */
function getCurrentTvInterval(timeoutMs = 1500) {
  return new Promise((resolve) => {
    if (!tvWidget || typeof tvWidget.getSymbolInfo !== 'function') { resolve(currentInterval); return; }
    let done = false;
    const timer = setTimeout(() => { if (!done) { done = true; resolve(currentInterval); } }, timeoutMs);
    try {
      tvWidget.getSymbolInfo((info) => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (info && info.interval) {
          currentInterval = String(info.interval);
          localStorage.setItem('chartInterval', currentInterval);
        }
        resolve(currentInterval);
      });
    } catch {
      if (!done) { done = true; clearTimeout(timer); resolve(currentInterval); }
    }
  });
}

function isCrypto(symbol) {
  const base = String(symbol).split('/')[0].toUpperCase();
  return CRYPTO_BASES.includes(base);
}

// Map "XAU/USD" / "BTC/USD" → TradingView symbol
function tvSymbol(symbol) {
  const [rawBase, rawQuote] = String(symbol).toUpperCase().split('/');
  const base = rawBase || symbol.toUpperCase();
  const quote = rawQuote || 'USD';
  if (isCrypto(symbol)) {
    // Binance niêm yết theo USDT
    const q = quote === 'USD' ? 'USDT' : quote;
    return `BINANCE:${base}${q}`;
  }
  // Vàng và forex → OANDA
  return `OANDA:${base}${quote}`;
}

// EMA 34 / 89 / 200, bật sẵn trên chart.
// Widget embed công khai BỎ QUA màu theo từng study (`override`) lẫn `studies_overrides`, nên
// 3 study "Moving Average Exponential" ra cùng một màu. "MA Ribbon" (STD;MA%Ribbon) thì nhận
// màu qua inputs: mỗi đường 5 input liên tiếp in_{5n}..in_{5n+4} = bật, loại MA, nguồn, độ dài,
// màu (4 đường, n = 0..3) — đường không dùng thì tắt bằng in_{5n} = false.
function ribbonLine(n, type, source, length, color) {
  const i = n * 5;
  return { ['in_' + i]: true, ['in_' + (i + 1)]: type, ['in_' + (i + 2)]: source,
           ['in_' + (i + 3)]: length, ['in_' + (i + 4)]: color };
}
const EMA_STUDIES = [
  { id: 'STD;MA%Ribbon', inputs: {
    ...ribbonLine(0, 'EMA', 'close', 34, '#2962ff'),
    ...ribbonLine(1, 'EMA', 'close', 89, '#00897b'),
    ...ribbonLine(2, 'EMA', 'close', 200, '#e91e63'),
    in_15: false,
  } },
];

function loadChart(symbol) {
  activeSymbol = symbol;
  localStorage.setItem('chartSymbol', symbol); // nhớ symbol đang xem
  document.getElementById('currentSymbol').textContent = symbol;
  document.getElementById('tv_chart').innerHTML = '';
  tvWidget = new TradingView.widget({
    autosize: true,
    symbol: tvSymbol(symbol),
    interval: currentInterval, // giữ interval người dùng đang xem (đổi symbol không reset về mặc định)
    timezone: 'Asia/Ho_Chi_Minh',
    theme: 'light',
    style: '1',
    locale: 'vi_VN',
    toolbar_bg: '#f1f3f6',
    enable_publishing: false,
    allow_symbol_change: true,
    withdateranges: true,
    hide_side_toolbar: false,
    studies: EMA_STUDIES,
    container_id: 'tv_chart',
  });
  // Widget embed công khai (tv.js) không có activeChart()/onIntervalChanged() — chỉ
  // getSymbolInfo() là API còn dùng được để đọc interval hiện tại (xem getCurrentTvInterval()).
  getCurrentTvInterval(); // cập nhật currentInterval ngay khi chart mở xong (fire-and-forget)
  // highlight active
  document.querySelectorAll('.symbol-pill').forEach(el => {
    el.classList.toggle('active', el.dataset.symbol === symbol);
  });
  document.getElementById('swingSymbol').textContent = symbol;
  // Đổi symbol KHÔNG tự dò lại — mỗi lần dò là một loạt request tới provider dữ liệu
  // thị trường, nên chỉ chạy khi người dùng chủ động bấm 🔄 (xem runSwing()).
  swingTimeframe = null;
  document.getElementById('swingBody').innerHTML =
    '<div class="empty">Bấm 🔄 để dò nhịp nhỏ cho ' + esc(symbol) + '.</div>';
}

function renderList() {
  const q = document.getElementById('searchInput').value.trim().toUpperCase();
  const list = document.getElementById('symbolsList');
  // Danh sách đã được API sắp theo sort_order trong DB → giữ nguyên thứ tự
  const filtered = symbols.filter(s =>
    !q || s.symbol.toUpperCase().includes(q) || String(s.name).toUpperCase().includes(q));

  document.getElementById('symbolCount').textContent = `${filtered.length}`;

  if (!filtered.length) {
    list.innerHTML = '<li class="empty">Không tìm thấy symbol nào.</li>';
    return;
  }

  list.innerHTML = filtered.map(s => {
    const crypto = isCrypto(s.symbol);
    const tagCls = crypto ? 'crypto' : 'fx';
    const tagLabel = crypto ? 'Crypto' : 'FX';
    const star = s.favorite ? '<span class="symbol-star">⭐</span>' : '';
    const active = s.symbol === activeSymbol ? ' active' : '';
    return `
    <li class="symbol-pill${active}" data-symbol="${esc(s.symbol)}" title="${esc(s.name)}" onclick="loadChart('${esc(s.symbol)}')">
      ${star}<span class="symbol-code">${esc(s.symbol)}</span>
      <span class="symbol-tag ${tagCls}">${tagLabel}</span>
      <span class="symbol-actions">
        <button class="symbol-signals" title="Xem tín hiệu từ Claude"
          onclick="event.stopPropagation(); showSignals('${esc(s.symbol)}')">📋</button>
        <button class="symbol-del" title="Xóa khỏi danh sách"
          onclick="event.stopPropagation(); deleteSymbol('${esc(s.symbol)}')">×</button>
      </span>
    </li>`;
  }).join('');
}

// Xóa symbol khỏi danh sách theo dõi
async function deleteSymbol(symbol) {
  if (!confirm(`Xóa ${symbol} khỏi danh sách?`)) return;
  try {
    const res = await apiFetch('/api/symbols/' + encodeURIComponent(symbol), { method: 'DELETE' });
    if (!res.ok && res.status !== 404) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Xóa thất bại');
    }
    const wasActive = symbol === activeSymbol;
    symbols = symbols.filter(s => s.symbol !== symbol);
    renderList();
    // Nếu vừa xóa symbol đang xem → chuyển sang symbol đầu danh sách (nếu còn)
    if (wasActive) {
      localStorage.removeItem('chartSymbol');
      activeSymbol = null;
      if (symbols.length) loadChart(symbols[0].symbol);
    }
    showToast(`✓ Đã xóa ${symbol}`, 'success');
  } catch (e) {
    showToast('✗ ' + (e.message || 'Xóa thất bại'), 'error');
  }
}

// ── Modal danh sách tín hiệu từ Claude (theo symbol, trong ngày) ──
function closeSignals() {
  document.getElementById('sigOverlay').classList.remove('show');
}

function toggleSigItem(el) {
  el.classList.toggle('open');
}

function fmtTok(n) {
  if (n == null) return '—';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(2) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'k';
  return String(n);
}

/** Tổng input của 1 lượt = input mới + cache read + cache write (theo cách Anthropic tính). */
function totalIn(log) {
  return (log.input_tokens || 0) + (log.cache_read_tokens || 0) + (log.cache_write_tokens || 0);
}

/** Badge token cạnh thời gian — rỗng với bản ghi cũ (chưa có cột token). */
function tokBadge(log) {
  if (log.input_tokens == null && log.output_tokens == null) return '';
  const cache = log.cache_read_tokens
    ? ` <span title="Token đọc lại từ prompt cache">⚡${fmtTok(log.cache_read_tokens)}</span>`
    : '';
  return `<span class="sig-tok" title="Token lượt phân tích này">
    ↓<b>${fmtTok(totalIn(log))}</b> ↑<b>${fmtTok(log.output_tokens)}</b>${cache}</span>`;
}

/** Dải tổng token của symbol trong ngày (cộng từ chính danh sách log đang hiển thị). */
function tokSummary(logs) {
  const scored = logs.filter(l => l.input_tokens != null || l.output_tokens != null);
  if (!scored.length) return '';
  const inTok  = scored.reduce((s, l) => s + totalIn(l), 0);
  const outTok = scored.reduce((s, l) => s + (l.output_tokens || 0), 0);
  const cache  = scored.reduce((s, l) => s + (l.cache_read_tokens || 0), 0);
  const avgSec = logs.reduce((s, l) => s + (l.duration_ms || 0), 0) / logs.length / 1000;
  return `<div class="sig-summary">
    <span>📊 <b>${logs.length}</b> lượt hôm nay</span>
    <span class="sep"></span>
    <span>↓ Input <b>${fmtTok(inTok)}</b></span>
    <span>↑ Output <b>${fmtTok(outTok)}</b></span>
    ${cache ? `<span title="Token đọc lại từ prompt cache">⚡ Cache <b>${fmtTok(cache)}</b></span>` : ''}
    <span class="sep"></span>
    <span>⏱ TB <b>${avgSec.toFixed(1)}s</b></span>
  </div>`;
}

async function showSignals(symbol) {
  const overlay = document.getElementById('sigOverlay');
  const body = document.getElementById('sigBody');
  document.getElementById('sigTitle').textContent = '📋 Tín hiệu từ Claude';
  document.getElementById('sigSymbol').textContent = symbol;
  body.innerHTML = '<div class="empty">Đang tải…</div>';
  overlay.classList.add('show');

  try {
    const res = await apiFetch('/api/symbols/' + encodeURIComponent(symbol) + '/signals?limit=50');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Tải tín hiệu thất bại');

    const logs = Array.isArray(data) ? data : [];
    if (!logs.length) {
      body.innerHTML = '<div class="empty">Chưa có tín hiệu nào cho ' + esc(symbol) + ' hôm nay.</div>';
      return;
    }

    const items = logs.map((log, i) => {
      const time = new Date(log.analyzed_at).toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' });
      const secs = log.duration_ms != null ? ` · ${(log.duration_ms / 1000).toFixed(1)}s` : '';
      // Mở sẵn bản ghi mới nhất
      const open = i === 0 ? ' open' : '';
      return `
      <div class="sig-item${open}">
        <div class="sig-item-head" onclick="toggleSigItem(this.parentElement)">
          <span class="sig-item-time">🕐 ${esc(time)}${secs}</span>
          ${log.analysis_type === 'daily_plan' ? '<span class="trig-badge plan">🗺 Plan</span>' : ''}
          ${log.trigger ? `<span class="trig-badge ${log.trigger === 'event' ? 'event' : ''}">${esc(W_TRIG_LABEL[log.trigger] || log.trigger)}</span>` : ''}
          ${tokBadge(log)}
          <span class="sig-toggle">›</span>
        </div>
        <div class="sig-item-body">
          <div class="sig-setup">${log.setup || ''}</div>
          <div class="sig-reasoning">${log.reasoning || ''}</div>
        </div>
      </div>`;
    }).join('');

    body.innerHTML = tokSummary(logs) + items;
  } catch (e) {
    body.innerHTML = '<div class="empty">✗ ' + esc(e.message || 'Tải tín hiệu thất bại') + '</div>';
  }
}

// ── Nhịp nhỏ: zigzag pivot trên symbol đang xem (cơ học, không gọi Claude) ──

const swingNum = n => n == null ? '—' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 6 });
// "2026-08-27 02:00:00" → "02:00 27/08" (mọi nến trong báo cáo đều thuộc vài phiên gần nhất)
const swingTime = t => {
  const m = String(t ?? '').match(/(\d{2})-(\d{2})[T ](\d{2}:\d{2})/);
  return m ? `${m[3]} ${m[2]}/${m[1]}` : (t ?? '—');
};
const swingR = n => `${n >= 0 ? '+' : ''}${n}R`;
// status = ĐƯỜNG ĐI với SL gốc; resultR = kết quả theo LUẬT THOÁT đang chọn. "SL sau
// TP{n}" nói thẳng chi phí của việc giữ lệnh — bản cũ tính trường hợp đó thành thắng.
const swingResult = s => {
  if (s.status === 'SL') return `❌ ${s.maxTpHit ? 'SL sau TP' + s.maxTpHit : 'SL'} (${swingR(s.resultR)})`;
  if (s.status === 'RUNNING') return `⏳ chạy (${swingR(s.resultR)})`;
  return `✅ ${s.status} (${swingR(s.resultR)})`;
};

// Dò nhịp nhỏ và đổ kết quả vào panel bên phải chart. Chỉ chạy khi người dùng bấm 🔄
// (runSwing) — không có job nền, không poll, không WebSocket.
async function loadSwingPanel() {
  const body = document.getElementById('swingBody');
  if (!activeSymbol) { body.innerHTML = '<div class="empty">Chọn một symbol để xem nhịp nhỏ.</div>'; return; }
  body.innerHTML = '<div class="empty">Đang dò nhịp…</div>';

  const liveInterval = await getCurrentTvInterval();
  const tf = tvIntervalToTimeframe(liveInterval);
  swingTimeframe = tf; // khung của kết quả sắp hiển thị — dùng để bỏ response về trễ

  try {
    const res = await apiFetch('/api/swing?symbol=' + encodeURIComponent(activeSymbol) + '&timeframe=' + tf);
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Dò nhịp thất bại');
    // Symbol/timeframe có thể đã đổi trong lúc chờ response → bỏ kết quả trễ, tránh đè nhầm panel.
    if ((data.symbol && data.symbol !== activeSymbol) || data.timeframe !== swingTimeframe) return;
    body.innerHTML = renderSwing(data);
  } catch (e) {
    body.innerHTML = '<div class="empty">✗ ' + esc(e.message || 'Dò nhịp thất bại') + '</div>';
  }
}

async function runSwing() {
  const btn = document.getElementById('swingBtn');
  if (btn.disabled) return;
  if (!activeSymbol) { showToast('Chưa chọn symbol nào', 'error'); return; }

  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '⏳';
  await loadSwingPanel();
  btn.disabled = false;
  btn.innerHTML = original;
}

// Đồng hồ thời gian thực (giờ VN) trong header panel nhịp nhỏ.
function tickClock() {
  const el = document.getElementById('liveClock');
  if (!el) return;
  el.textContent = new Date().toLocaleTimeString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour12: false });
}

function renderSwing(data) {
  const { latest, stats, signals, params } = data;

  const summary = `<div class="sig-summary">
    <span>🔁 <b>${stats.total}</b> nhịp · <b>${stats.resolved}</b> đã đóng</span>
    <span class="sep"></span>
    <span>Winrate <b>${stats.winRatePct == null ? '—' : stats.winRatePct + '%'}</b></span>
    <span>Tổng <b>${stats.totalR >= 0 ? '+' : ''}${stats.totalR}R</b></span>
    <span>TB <b>${stats.avgR == null ? '—' : (stats.avgR >= 0 ? '+' : '') + stats.avgR + 'R'}</b></span>
    <span class="sep"></span>
    <span>${esc(data.timeframe)} · pivot ${params.pivotLookback} nến · lọc ≥ ${params.minLegAtr}× ATR</span>
  </div>`;

  if (!latest) {
    return summary + '<div class="empty">Không có nhịp nào đủ lớn so với ngưỡng lọc — thị trường đang đi ngang trong biên hẹp.</div>';
  }

  // Tín hiệu đã đóng hoặc quá cũ vẫn hiện, nhưng ghi rõ là không vào được nữa.
  const note = data.actionable
    ? `✅ Còn vào được — tín hiệu ra cách đây ${latest.barsAgo} nến.`
    : latest.status !== 'RUNNING'
      ? `⛔ Nhịp này đã đóng (${latest.status}) — chờ pivot mới.`
      : `⛔ Đã ra cách đây ${latest.barsAgo} nến, giá rời entry quá xa — chờ nhịp mới.`;

  const tps = latest.takeProfits
    .map((tp, i) => `TP${i + 1} <b>${swingNum(tp)}</b> (${params.tpR[i]}R)`).join(' · ');

  const latestBlock = `<div class="sig-item open">
    <div class="sig-item-head" onclick="toggleSigItem(this.parentElement)">
      <span class="sig-item-time">${latest.direction === 'BUY' ? '🟢 BUY' : '🔴 SELL'} @ ${swingNum(latest.entry)}</span>
      <span class="sig-tok">${esc(swingTime(latest.signalTime))}</span>
      <span class="sig-toggle">›</span>
    </div>
    <div class="sig-item-body">
      <div style="margin-bottom:8px">${esc(note)}</div>
      <table>
        <tr><td>Entry</td><td><b>${swingNum(latest.entry)}</b></td></tr>
        <tr><td>Stop loss</td><td><b>${swingNum(latest.stopLoss)}</b> — 1R = ${swingNum(latest.risk)}</td></tr>
        <tr><td>Take profit</td><td>${tps}</td></tr>
        <tr><td>Pivot</td><td>${swingNum(latest.pivotPrice)} (${esc(swingTime(latest.pivotTime))}) — nhịp trước dài <b>${latest.legAtr}× ATR</b></td></tr>
        <tr><td>Trạng thái</td><td>${esc(swingResult(latest))}</td></tr>
      </table>
      ${latest.provisional
        ? '<div style="margin-top:8px">⚠️ Nhịp đảo chiều chưa đủ lớn — pivot còn có thể bị dời (repaint), tín hiệu này có thể biến mất.</div>'
        : ''}
    </div>
  </div>`;

  // Bội số R lấy từ params (SWING_TP_R có thể cấu hình ít hơn 3 mức) → bỏ trống nếu thiếu.
  const tpHead = i => `TP${i + 1}${params.tpR[i] == null ? '' : ` (${params.tpR[i]}R)`}`;

  const rows = signals.slice(-15).reverse().map(s => `<tr>
      <td>${esc(swingTime(s.signalTime))}</td>
      <td>${s.direction === 'BUY' ? '🟢 BUY' : '🔴 SELL'}</td>
      <td>${swingNum(s.entry)}</td>
      <td>${swingNum(s.stopLoss)}</td>
      <td>${swingNum(s.takeProfits[0])}</td>
      <td>${swingNum(s.takeProfits[1])}</td>
      <td>${swingNum(s.takeProfits[2])}</td>
      <td>${s.legAtr}×</td>
      <td>${s.mfeR}R</td>
      <td>${esc(swingResult(s))}</td>
    </tr>`).join('');

  const history = `<div class="sig-item open">
    <div class="sig-item-head" onclick="toggleSigItem(this.parentElement)">
      <span class="sig-item-time">📜 ${Math.min(15, signals.length)} nhịp gần nhất</span>
      <span class="sig-toggle">›</span>
    </div>
    <div class="sig-item-body">
      <!-- 10 cột không đủ chỗ trong modal 720px trên màn hẹp → cho cuộn ngang thay vì bóp chữ. -->
      <div style="overflow-x:auto">
        <table style="white-space:nowrap">
          <tr><th>Xác nhận</th><th>Chiều</th><th>Entry</th><th>SL</th>
            <th>${tpHead(0)}</th><th>${tpHead(1)}</th><th>${tpHead(2)}</th>
            <th>Nhịp</th><th>MFE</th><th>Kết quả</th></tr>
          ${rows}
        </table>
      </div>
      <div style="margin-top:10px;color:var(--muted);font-size:12px">
        Tín hiệu cơ học, không đọc bối cảnh POI/thanh khoản như phân tích AI.
        Winrate đo trên chính đoạn nến đang xét (backtest trong mẫu) — dùng để chỉnh tham số, không phải kỳ vọng tương lai.
      </div>
    </div>
  </div>`;

  return summary + latestBlock + history;
}

function getApiKey() { return localStorage.getItem('apiKey') || ''; }

// fetch có kèm x-api-key; tự prompt key rồi thử lại 1 lần khi gặp 401
async function apiFetch(url, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  const key = getApiKey();
  if (key) headers['x-api-key'] = key;
  let res = await fetch(url, { ...opts, headers });
  if (res.status === 401) {
    const k = prompt('Nhập API key (API_SERVER_KEY):', key);
    if (k != null) localStorage.setItem('apiKey', k.trim());
    res = await fetch(url, { ...opts, headers: { ...headers, 'x-api-key': getApiKey() } });
  }
  return res;
}

let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 4500);
}

// Phân tích symbol đang chọn trên chart (endpoint tùy chọn, mặc định intraday)
async function runAnalyze(btnId = 'analyzeBtn', endpoint = '/api/analyze') {
  const btn = document.getElementById(btnId);
  if (btn.disabled) return;
  if (!activeSymbol) { showToast('Chưa chọn symbol nào', 'error'); return; }

  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Đang phân tích...';
  showToast(`Đang phân tích ${activeSymbol}, vui lòng đợi...`);

  try {
    const res = await apiFetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ symbol: activeSymbol }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Phân tích thất bại');
    const tok = data.usage
      ? ` · ${fmtTok(data.usage.total_input_tokens)}↓ / ${fmtTok(data.usage.output_tokens)}↑`
      : '';
    const secs = data.duration_ms != null ? ` (${(data.duration_ms / 1000).toFixed(1)}s${tok})` : '';
    showToast(`✓ Phân tích ${activeSymbol} hoàn tất${secs} — xem ở trang Tín hiệu`, 'success');
  } catch (e) {
    showToast('✗ ' + (e.message || 'Phân tích thất bại'), 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

// Server chạy nền lần lượt từng symbol (~3 phút/symbol) và trả 202 ngay; tiến độ đọc từ
// GET /api/daily-plan (running / current_symbol / last_batch), hiện thẳng trên nút.
const PLAN_BTN_LABEL = '🗺 Kế hoạch ngày';
let planPollTimer = null;

async function runDailyPlanAll() {
  const btn = document.getElementById('planBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    const res = await apiFetch('/api/daily-plan/run-all', { method: 'POST' });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Lập kế hoạch ngày thất bại');
    showToast(`Đang lập kế hoạch ngày cho ${data.symbols.join(', ')} (~${data.symbols.length * 3} phút)...`);
    renderPlanProgress({ running: true, current_symbol: data.symbols[0], last_batch: { symbols: data.symbols, results: [] } });
    startPlanPoll();
  } catch (e) {
    showToast('✗ ' + (e.message || 'Lập kế hoạch ngày thất bại'), 'error');
    btn.disabled = false;
  }
}

function renderPlanProgress(st) {
  const btn = document.getElementById('planBtn');
  const b = st.last_batch;
  if (!st.running || !b) {
    btn.disabled = false;
    btn.innerHTML = PLAN_BTN_LABEL;
    return;
  }
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>Plan ${b.results.length + 1}/${b.symbols.length} · ${st.current_symbol ?? ''}`;
}

function startPlanPoll() {
  clearInterval(planPollTimer);
  planPollTimer = setInterval(pollPlanStatus, 10_000);
}

// silent = lần đọc lúc tải trang: không prompt API key, không báo kết quả lượt cũ.
async function pollPlanStatus(silent = false) {
  try {
    const headers = getApiKey() ? { 'x-api-key': getApiKey() } : {};
    const res = await fetch('/api/daily-plan', { headers });
    if (!res.ok) return;
    const st = await res.json();
    renderPlanProgress(st);
    if (st.running) {
      if (!planPollTimer) startPlanPoll();
      return;
    }
    clearInterval(planPollTimer);
    planPollTimer = null;
    if (silent || !st.last_batch) return;
    const results = st.last_batch.results;
    const failed = results.filter(r => !r.ok);
    if (failed.length === 0) {
      showToast(`✓ Đã lập kế hoạch ngày: ${results.map(r => `${r.symbol} (${r.duration_sec}s)`).join(', ')}`, 'success');
    } else {
      showToast(`✗ Kế hoạch ngày lỗi: ${failed.map(r => `${r.symbol}: ${r.error}`).join(' · ')}`, 'error');
    }
  } catch { /* mạng chập chờn — đợi lần poll sau */ }
}

// ── Theo dõi SetupWatcher: chuỗi sweep → BOS/CHoCH → retest của từng symbol ──
// Đọc GET /api/setup-watcher. Nút trên header tóm tắt bước xa nhất đang có; modal hiện
// chi tiết từng hướng BUY/SELL. Watcher dò cơ học mỗi vài phút, KHÔNG gọi AI — chỉ khi
// một hướng tới RETEST (và không ngược bias khung lớn) mới kích hoạt phân tích Claude.

const W_STEPS = [
  { stage: 'SWEPT', label: '① Quét thanh khoản' },
  { stage: 'CONFIRMED', label: '② BOS/CHoCH + displacement' },
  { stage: 'RETEST', label: '③ Hồi về FVG/OB' },
];
const W_RANK = { NONE: 0, SWEPT: 1, CONFIRMED: 2, RETEST: 3 };
let watcherTimer = null;

const vnTime = iso => iso
  ? new Date(iso).toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour12: false })
  : '—';

function wStepper(stage) {
  const rank = W_RANK[stage] ?? 0;
  return '<div class="w-steps">' + W_STEPS.map((s, i) => {
    const r = i + 1;
    // Bước đã qua = xanh; bước vừa đạt (bước xa nhất) = vàng, riêng RETEST là đích → xanh.
    const cls = r < rank || (r === rank && stage === 'RETEST') ? 'done' : r === rank ? 'now' : '';
    return (i ? '<span class="w-arrow">→</span>' : '') + `<span class="w-step ${cls}">${s.label}</span>`;
  }).join('') + '</div>';
}

/** Các mức sweep / cú phá / vùng retest của một hướng — dùng chung tab Hiện tại và Lịch sử. */
function wFacts(s) {
  const facts = [];
  if (s.sweep) {
    facts.push(`Quét ${s.sweep.side === 'SELLSIDE' ? 'đáy' : 'đỉnh'} ${s.sweep.levelType === 'EQUAL' ? 'equal level' : 'swing'} `
      + `<b>${swingNum(s.sweep.level)}</b> · râu tới <b>${swingNum(s.sweep.extreme)}</b> · ${esc(swingTime(s.sweep.time))}`);
  }
  if (s.structure) {
    const st = s.structure;
    facts.push(`${esc(st.kind)} ${esc(st.direction)} phá <b>${swingNum(st.level)}</b> · thân <b>${st.bodyAtr}×</b> ATR`
      + `${st.displacement ? '' : ' (yếu)'} · ${esc(swingTime(st.time))}`);
  }
  if (s.zone) {
    const z = s.zone;
    const zs = z.invalidated ? `hỏng (xuyên ${z.penetrationAtr ?? '?'}× ATR)`
      : z.penetrationAtr ? `xuyên nông ${z.penetrationAtr}× ATR — còn hiệu lực`
      : z.mitigated ? 'đã chạm' : 'fresh';
    facts.push(`Vùng retest ${esc(z.source)} <b>${swingNum(z.bottom)} – ${swingNum(z.top)}</b> · ${zs}`);
  }
  return facts.length ? '<ul class="w-facts">' + facts.map(f => `<li>${f}</li>`).join('') + '</ul>' : '';
}

// Quan hệ hướng ↔ bias khung lớn. Chỉ 'no' (ngược rõ ràng) mới chặn gọi AI; 'neutral' vẫn cho qua.
// Suy từ bias thay vì bias_ok để bản ghi trước khi đổi luật (bias_ok=false khi NEUTRAL) vẫn hiện đúng.
const BIAS_TAG = {
  ok:      ['bias-ok', 'trùng bias'],
  neutral: ['bias-neutral', 'bias trung tính'],
  no:      ['bias-no', 'ngược bias'],
};
function biasRel(direction, bias) {
  if (bias === (direction === 'BUY' ? 'BULLISH' : 'BEARISH')) return 'ok';
  if (bias === (direction === 'BUY' ? 'BEARISH' : 'BULLISH')) return 'no';
  return 'neutral';
}

function wDirBlock(s, bias) {
  const buy = s.direction === 'BUY';
  const [biasCls, biasLabel] = BIAS_TAG[biasRel(s.direction, bias)];
  const biasTag = `<span class="w-tag ${biasCls}">${biasLabel}</span>`;
  return `<div class="w-dir">
    <div class="w-dir-top">
      <span class="w-dir-name ${buy ? 'buy' : 'sell'}">${buy ? '🟢 BUY' : '🔴 SELL'}</span>
      ${wStepper(s.stage)}
      ${s.stage !== 'NONE' ? biasTag : ''}
    </div>
    <div class="w-note">${esc(s.note || '—')}</div>
    ${wFacts(s)}
  </div>`;
}

function renderWatcherBtn(st) {
  const btn = document.getElementById('watcherBtn');
  btn.classList.remove('st-retest', 'st-confirmed', 'st-off');
  if (!st) { btn.textContent = '🎯 Watcher: lỗi'; btn.title = 'Không đọc được trạng thái watcher'; return; }
  if (!st.enabled) { btn.textContent = '🎯 Watcher: TẮT'; btn.classList.add('st-off'); btn.title = 'SETUP_WATCHER_ENABLED=false'; return; }

  // Bước xa nhất trong mọi symbol/hướng → màu nút.
  let best = 0;
  for (const snap of Object.values(st.symbols || {})) {
    for (const s of snap.setups || []) best = Math.max(best, W_RANK[s.stage] ?? 0);
  }
  if (best >= 3) btn.classList.add('st-retest');
  else if (best >= 2) btn.classList.add('st-confirmed');
  const label = best >= 3 ? 'RETEST' : best >= 2 ? 'chờ retest' : best >= 1 ? 'đã quét' : 'chờ';
  btn.textContent = `🎯 Watcher: ${label} · ${st.triggers_today}/${st.max_per_day > 0 ? st.max_per_day : "∞"}`;
  btn.title = `Dò mỗi ${st.interval_min}p trên ${st.timeframe}, bias ${st.bias_timeframe}${st.crypto_bias_timeframe && st.crypto_bias_timeframe !== st.bias_timeframe ? " (crypto " + st.crypto_bias_timeframe + ")" : ""}. `
    + `Đã kích hoạt AI ${st.triggers_today}/${st.max_per_day > 0 ? st.max_per_day : "∞"} lần hôm nay. Bấm để xem chi tiết.`;
}

// ── Tab symbol trong modal: lọc cả "Hiện tại" lẫn "Lịch sử" (lọc phía client, không gọi lại API) ──
let watcherSym = (() => { try { return localStorage.getItem('watcherSym') || 'ALL'; } catch { return 'ALL'; } })();
let watcherLastStatus = null;
let watcherLastHistory = null;

function watcherSymMatch(symbol) { return watcherSym === 'ALL' || symbol === watcherSym; }

/** Bước xa nhất (0–3) của một symbol trong snapshot hiện tại — màu chấm trên tab. */
function watcherSymRank(symbol) {
  const snap = watcherLastStatus?.symbols?.[symbol];
  return Math.max(0, ...((snap?.setups || []).map(s => W_RANK[s.stage] ?? 0)));
}

function renderWatcherSymTabs() {
  const el = document.getElementById('wSymTabs');
  const st = watcherLastStatus;
  const list = [...new Set([
    ...(st?.watch_symbols || Object.keys(st?.symbols || {})),
    // Ngày cũ có thể có symbol đã bỏ khỏi danh sách dò → vẫn cho lọc.
    ...(watcherTab === 'history' ? (watcherLastHistory?.ticks || []).map(t => t.symbol) : []),
    ...(watcherTab === 'history' ? (watcherLastHistory?.events || []).map(e => e.symbol) : []),
  ])];
  if (watcherSym !== 'ALL' && !list.includes(watcherSym)) watcherSym = 'ALL';
  if (list.length < 2) { el.style.display = 'none'; return; } // 1 symbol → tab thừa
  el.style.display = '';

  // Lịch sử: đếm số lần đổi bước của mỗi symbol trong ngày; Hiện tại: chấm màu theo bước xa nhất.
  const evCount = sym => (watcherLastHistory?.events || []).filter(e => e.symbol === sym).length;
  const tab = (sym, label, extra) =>
    `<button class="w-symtab${watcherSym === sym ? ' active' : ''}" role="tab" aria-selected="${watcherSym === sym}"`
    + ` data-sym="${esc(sym)}" onclick="selectWatcherSym(this.dataset.sym)">${extra}${esc(label)}</button>`;
  el.innerHTML = tab('ALL', 'Tất cả', '') + list.map(sym => {
    const extra = watcherTab === 'history'
      ? ''
      : `<span class="w-dot${watcherSymRank(sym) ? ' s' + watcherSymRank(sym) : ''}"></span>`;
    const cnt = watcherTab === 'history' ? ` <span class="w-cnt">${evCount(sym)}</span>` : '';
    return tab(sym, sym, extra).replace('</button>', cnt + '</button>');
  }).join('');
}

function selectWatcherSym(sym) {
  watcherSym = sym;
  try { localStorage.setItem('watcherSym', sym); } catch { /* chế độ riêng tư — chỉ mất ghi nhớ */ }
  if (watcherTab === 'history' && watcherLastHistory) renderWatcherHistory(watcherLastHistory);
  else if (watcherLastStatus) renderWatcher(watcherLastStatus);
}

function renderWatcher(st) {
  const body = document.getElementById('wBody');
  const parts = [];
  watcherLastStatus = st;
  renderWatcherSymTabs();

  parts.push(`<div class="sig-summary">
    <span>${st.enabled ? '🟢 <b>BẬT</b>' : '⚪ <b>TẮT</b>'}</span>
    <span class="sep"></span>
    <span>Khung <b>${esc(st.timeframe)}</b> · bias <b>${esc(st.bias_timeframe)}</b>${st.crypto_bias_timeframe && st.crypto_bias_timeframe !== st.bias_timeframe ? " (crypto <b>" + esc(st.crypto_bias_timeframe) + "</b>)" : ""}${st.require_bias ? '' : ' (không bắt buộc)'}</span>
    <span class="sep"></span>
    <span>Kích hoạt AI hôm nay <b>${st.triggers_today}/${st.max_per_day > 0 ? st.max_per_day : "∞"}</b></span>
    <span>Cooldown <b>${st.cooldown_min}p</b></span>
    <span class="sep"></span>
    <span>Tick gần nhất <b>${esc(vnTime(st.last_tick_at))}</b></span>
    <span>Tick kế <b>${esc(vnTime(st.next_run_at))}</b></span>
  </div>`);

  if (!st.in_window_now) {
    parts.push(`<div class="w-alert info">⏸ Ngoài khung giờ dò (${esc(st.window)}, ngày ${esc((st.weekdays || []).join(','))} — 0=CN). Số liệu bên dưới là của lần dò cuối.</div>`);
  }
  if (st.running) parts.push('<div class="w-alert info">⏳ Đang dò / đang chờ một lượt phân tích AI chạy xong…</div>');
  if (st.last_trigger) {
    const t = st.last_trigger;
    parts.push(`<div class="w-alert info">⚡ Kích hoạt gần nhất: <b>${esc(t.symbol)}</b> lúc ${esc(vnTime(t.at))}`
      + ` → ${t.action ? 'kết quả <b>' + esc(t.action) + '</b>' : '<b>lỗi</b> (xem log)'}</div>`);
  }
  if (st.last_error) parts.push(`<div class="w-alert err">✗ Lỗi gần nhất: ${esc(st.last_error)}</div>`);

  const snaps = Object.entries(st.symbols || {}).filter(([symbol]) => watcherSymMatch(symbol));
  if (!snaps.length) {
    parts.push(`<div class="empty">Chưa có lần dò nào${watcherSym === 'ALL' ? '' : ' cho ' + esc(watcherSym)} — watcher vừa khởi động hoặc đang ngoài khung giờ.</div>`);
  }
  for (const [symbol, snap] of snaps) {
    const setups = (snap.setups || []).slice().sort((a, b) => a.direction.localeCompare(b.direction)); // BUY trước SELL
    parts.push(`<div class="w-sym">
      <div class="w-sym-head">
        <b>${esc(symbol)}</b>
        <span>Giá <b style="font-size:13px">${swingNum(snap.price)}</b></span>
        <span>Bias ${esc(snap.bias_timeframe || st.bias_timeframe)}: <b style="font-size:13px">${esc(snap.bias || '—')}</b></span>
        <span class="w-upd">cập nhật ${esc(vnTime(snap.at))}</span>
      </div>
      ${setups.map(s => wDirBlock(s, snap.bias)).join('')}
    </div>`);
  }

  body.innerHTML = parts.join('');
}

async function fetchWatcher() {
  const res = await fetch('/api/setup-watcher', { headers: getApiKey() ? { 'x-api-key': getApiKey() } : {} });
  if (!res.ok) throw new Error(res.status === 401 ? 'Cần API key (401)' : 'HTTP ' + res.status);
  return res.json();
}

async function loadWatcherStatus() {
  try { renderWatcherBtn(await fetchWatcher()); } catch { renderWatcherBtn(null); }
}

// ── Tab Lịch sử: mọi lần dò (setup_watch_ticks) + các lần một hướng ĐỔI bước (setup_watch_events) ──
let watcherTab = 'now';

const W_STAGE_LABEL = { SWEPT: '① Đã quét', CONFIRMED: '② BOS/CHoCH', RETEST: '③ Retest', NONE: '✕ Hủy / hết hạn' };
const W_TRIG_LABEL = { event: '🎯 Watcher', scheduler: '⏱ Theo lịch', api: '👆 Bấm tay', mcp: 'MCP' };

function todayVn() {
  // en-CA cho ra dạng YYYY-MM-DD — đúng format của <input type="date">.
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Ho_Chi_Minh' });
}

function wStageTag(stage, cls) {
  return `<span class="w-step ${cls}">${esc(W_STAGE_LABEL[stage] || stage || '—')}</span>`;
}

const W_OUTCOME_LABEL = { TRIGGERED: '⚡ Gọi AI', SKIPPED: '⏸ Không gọi AI', ERROR: '✗ Lỗi', BUSY: '⏭ Bỏ tick', IDLE: '' };
const hhmm = iso => new Date(iso).toLocaleTimeString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit', hour12: false });

/** Thẻ một lần ĐỔI bước (bảng setup_watch_events). */
function wEventCard(e) {
  const buy = e.direction === 'BUY';
  const to = e.stage === 'NONE' ? wStageTag('NONE', 'dead') : wStageTag(e.stage, e.stage === 'RETEST' ? 'done' : 'now');
  const from = e.prev_stage && e.prev_stage !== 'NONE' ? wStageTag(e.prev_stage, '') + '<span class="w-arrow">→</span>' : '';
  let result = '';
  if (e.triggered) {
    result = `<div class="w-ev-res fired">⚡ Đã gọi AI${e.triggered_at ? ' lúc ' + esc(vnTime(e.triggered_at)) : ''} → `
      + `${e.analysis_action ? 'kết quả ' + esc(e.analysis_action) : 'đang chạy…'}</div>`;
  } else if (e.skip_reason) {
    result = `<div class="w-ev-res skip">⏸ Không gọi AI: ${esc(e.skip_reason)}</div>`;
  }
  return `<div class="w-ev">
    <div class="w-ev-top">
      <span class="w-ev-time">${esc(hhmm(e.created_at))}</span>
      <span class="w-dir-name ${buy ? 'buy' : 'sell'}">${buy ? '🟢 BUY' : '🔴 SELL'}</span>
      <span class="w-steps">${from}${to}</span>
      <span class="w-ev-sym">${esc(e.symbol)} · ${esc(e.timeframe)} · giá ${swingNum(e.price)} · bias ${esc(e.bias || '—')}</span>
    </div>
    <div class="w-note">${esc(e.note || '')}</div>
    ${wFacts(e)}
    ${result}
  </div>`;
}

/** Chip bước của một hướng trong dòng tick: "BUY ② BOS/CHoCH", NONE = xám. */
function wTickStage(dir, stage) {
  if (!stage) return '';
  const cls = stage === 'RETEST' ? 'done' : stage === 'NONE' ? '' : 'now';
  const label = stage === 'NONE' ? 'chưa có' : (W_STAGE_LABEL[stage] || stage);
  return `<span class="w-step ${cls}">${dir} ${esc(label)}</span>`;
}

/** Một dòng = một lần watcher dò một symbol (bảng setup_watch_ticks) + các lần đổi bước của lần đó. */
function wTickRow(t, evs) {
  const out = W_OUTCOME_LABEL[t.outcome] ?? esc(t.outcome);
  const action = t.outcome === 'TRIGGERED'
    ? ' → ' + (t.analysis_action ? '<b>' + esc(t.analysis_action) + '</b>' : 'đang chạy…') : '';
  const idle = t.outcome === 'IDLE' && !evs.length;
  const notes = Object.entries(t.setups || {})
    .map(([dir, x]) => `<div><b>${esc(dir)}</b>: ${esc(x.note || '—')}${biasRel(dir, t.bias) === 'ok' ? '' : ' <i>(' + BIAS_TAG[biasRel(dir, t.bias)][1] + ')</i>'}</div>`)
    .join('');
  return `<div class="w-tick o-${esc(t.outcome)}${idle ? ' idle' : ''}${evs.length ? ' has-ev' : ''}">
    <div class="w-tick-top">
      <span class="w-ev-time">${esc(hhmm(t.created_at))}</span>
      <span class="w-ev-sym">${esc(t.symbol)} · ${esc(t.timeframe)}${t.price != null ? ' · giá ' + swingNum(t.price) : ''}${t.bias ? ' · bias ' + esc(t.bias) : ''}</span>
      ${wTickStage('BUY', t.buy_stage)}${wTickStage('SELL', t.sell_stage)}
      ${out ? `<span class="w-tick-out ${esc(t.outcome)}">${out}${action}</span>` : ''}
    </div>
    ${t.reason ? `<div class="w-tick-reason">${esc(t.reason)}</div>` : ''}
    ${notes ? `<details><summary>Ghi chú từng hướng</summary>${notes}</details>` : ''}
    ${evs.map(wEventCard).join('')}
  </div>`;
}

function renderWatcherHistory(h) {
  const body = document.getElementById('wBody');
  watcherLastHistory = h;
  renderWatcherSymTabs();
  const events = (h.events || []).filter(e => watcherSymMatch(e.symbol));
  const ticks = (h.ticks || []).filter(t => watcherSymMatch(t.symbol));
  const onlyChanges = document.getElementById('wHistFilter').value === 'changes';
  const fired = events.filter(e => e.triggered);
  const count = o => ticks.filter(t => t.outcome === o).length;
  const errors = count('ERROR'), busy = count('BUSY');

  // Gắn mỗi lần đổi bước vào lần dò sinh ra nó: lần dò mới nhất cùng symbol bắt đầu
  // trước nó (tick ghi giờ BẮT ĐẦU, đổi bước ghi trong lúc dò). Không khớp tick nào
  // (dữ liệu trước khi có bảng setup_watch_ticks) → hiện riêng.
  const ticksBySym = {};
  for (const t of ticks) (ticksBySym[t.symbol] ||= []).push(t); // đã sắp mới → cũ
  const evByTick = new Map();
  const loose = [];
  for (const e of events) {
    const at = new Date(e.created_at).getTime();
    const t = (ticksBySym[e.symbol] || []).find(x => new Date(x.created_at).getTime() <= at);
    const fits = t && at - new Date(t.created_at).getTime() <= (t.duration_ms || 0) + 60_000;
    if (fits) {
      if (!evByTick.has(t.id)) evByTick.set(t.id, []);
      evByTick.get(t.id).push(e);
    } else {
      loose.push(e);
    }
  }

  const parts = [`<div class="sig-summary">
    <span>📅 <b>${esc(h.date)}</b>${watcherSym === 'ALL' ? '' : ' · <b>' + esc(watcherSym) + '</b>'}</span>
    <span class="sep"></span>
    <span><b>${ticks.length}</b> lần dò</span>
    <span><b>${events.length}</b> lần đổi bước</span>
    <span>🎯 Gọi AI <b>${fired.length}</b> lần</span>
    ${fired.length ? `<span>Kết quả: ${fired.map(e => '<b>' + esc(e.analysis_action || '…') + '</b>').join(', ')}</span>` : ''}
    ${errors ? `<span style="color:#b91c1c">✗ Lỗi <b>${errors}</b></span>` : ''}
    ${busy ? `<span>⏭ Bỏ tick <b>${busy}</b></span>` : ''}
    ${ticks.length ? `<span class="sep"></span><span>${esc(hhmm(ticks[ticks.length - 1].created_at))} → ${esc(hhmm(ticks[0].created_at))}</span>` : ''}
  </div>`];

  // Dòng thời gian chung, mới nhất trước: lần dò (kèm đổi bước lồng trong) + đổi bước lẻ.
  const items = [
    ...ticks.map(t => ({
      at: t.created_at,
      html: () => wTickRow(t, evByTick.get(t.id) || []),
      changed: t.outcome !== 'IDLE' || evByTick.has(t.id),
    })),
    ...loose.map(e => ({ at: e.created_at, html: () => wEventCard(e), changed: true })),
  ].sort((a, b) => new Date(b.at) - new Date(a.at));
  const shown = onlyChanges ? items.filter(i => i.changed) : items;

  if (!ticks.length && events.length) {
    parts.push('<div class="w-alert info">Ngày này chưa ghi từng lần dò (chỉ có các lần đổi bước).</div>');
  }
  if (!shown.length) {
    parts.push(`<div class="empty">${onlyChanges && items.length
      ? 'Không có lần dò nào có thay đổi / gọi AI trong ngày này.'
      : 'Watcher không chạy lần nào trong ngày này.'}</div>`);
  }
  parts.push(...shown.map(i => i.html()));
  body.innerHTML = parts.join('');
}

function switchWatcherTab(tab) {
  watcherTab = tab;
  document.getElementById('wTabNow').classList.toggle('active', tab === 'now');
  document.getElementById('wTabHist').classList.toggle('active', tab === 'history');
  const date = document.getElementById('wDate');
  date.style.display = tab === 'history' ? '' : 'none';
  document.getElementById('wHistFilter').style.display = tab === 'history' ? '' : 'none';
  if (tab === 'history' && !date.value) date.value = todayVn();
  loadWatcher(true);
}

async function loadWatcher(showSpinner) {
  const body = document.getElementById('wBody');
  if (showSpinner) body.innerHTML = '<div class="empty">Đang tải…</div>';
  try {
    // Modal dùng apiFetch để được hỏi API key khi 401 (nút header thì không hỏi).
    if (watcherTab === 'history') {
      const date = document.getElementById('wDate').value || todayVn();
      const res = await apiFetch('/api/setup-watcher/history?date=' + encodeURIComponent(date));
      const h = await res.json();
      if (!res.ok) throw new Error(h.error || 'HTTP ' + res.status);
      renderWatcherHistory(h);
      return;
    }
    const res = await apiFetch('/api/setup-watcher');
    const st = await res.json();
    if (!res.ok) throw new Error(st.error || 'HTTP ' + res.status);
    renderWatcher(st);
    renderWatcherBtn(st);
  } catch (e) {
    body.innerHTML = '<div class="empty">✗ ' + esc(e.message || 'Tải trạng thái watcher thất bại') + '</div>';
  }
}

function openWatcher() {
  document.getElementById('wOverlay').classList.add('show');
  loadWatcher(true);
  clearInterval(watcherTimer);
  watcherTimer = setInterval(() => loadWatcher(false), 30_000); // modal mở → làm mới nhanh hơn
}

function closeWatcher() {
  document.getElementById('wOverlay').classList.remove('show');
  clearInterval(watcherTimer);
  watcherTimer = null;
}

loadSymbols();
loadSchedulerStatus();
loadWatcherStatus();
pollPlanStatus(true); // tải lại trang giữa lượt plan → nút vẫn hiện tiến độ
tickClock();
setInterval(loadSchedulerStatus, 60_000);
setInterval(loadWatcherStatus, 60_000);
setInterval(tickClock, 1_000);
</script>
</body>
